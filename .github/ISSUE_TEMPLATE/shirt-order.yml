name: Shirt Order
description: Order a Bentaco's Viking art shirt - tap the menus
title: "Shirt Order"
body:
  - type: markdown
    attributes:
      value: |
        ## Prices, Sizes & Colors
        Everything you need before you order - right here.

        <table>
        <tr>
        <td valign="top"><b>Shirt price</b><br>Kids (by age): <b>$18</b><br>Adult S-XL: <b>$20</b><br>Adult 2XL: <b>$23</b><br>Adult 3XL+: <b>$25</b></td>
        <td valign="top"><b>Customizing (add-on)</b><br>Small text (name/word): <b>+$3</b><br>Medium (a phrase): <b>+$5</b><br>Large text or image: <b>+$7</b><br>Text and an image: <b>+$10</b></td>
        </tr>
        </table>

        **Sizes** - Adult: S, M, L, XL, 2XL, 3XL.  Kids: by age, 2 through 14.

        **Colors** - Black, White, Gray, Navy, Red, Royal Blue, Green, Pink, Purple (or ask for another).

        ---
        ## Order Your Shirt(s)
        Tap the menus below. Design # is split into two menus (1-40 and 41-74) - use the one your number is in. Only Shirt 1 is required; fill more of 2-10 if you want.
