name: 🛒 Shirt Order
description: Order a Bentacö's Viking art shirt — tap the menus
title: "Shirt Order"
body:
  - type: markdown
    attributes:
      value: |
        ## ⚔️ Order Your Shirt(s) ⚔️
        Tap the menus. Your design number is split across two menus (1–40 and 41–74) — use whichever one your number is in and leave the other on "— none —".
        Only Shirt 1 is required; fill more if you want. The only typing is your name, contact, payment name, and address (if shipping).
